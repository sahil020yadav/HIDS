<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — HIDS-IoT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-3"
             style="width:56px;height:56px;background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);">
          <i class="bi bi-shield-exclamation text-accent fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">HIDS-IoT Console</h1>
        <p class="text-secondary small">Host-Based Intrusion Detection for IoT</p>
      </div>

      <div class="panel-card p-4">
        <div id="form-error" class="alert alert-danger py-2 small d-none"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
            <div class="invalid-feedback">Email is required</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required />
            <div class="invalid-feedback">Password is required</div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-accent w-100 py-2">Sign in</button>
          <p class="text-secondary small text-center mt-3 mb-0">
            No account? <a href="register.html" class="text-accent">Register</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
